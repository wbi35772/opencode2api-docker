services:
  opencode2api:
    build: .
    image: ${OPENCODE2API_IMAGE:-opencode2api:local}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      CONFIG_PATH: /var/lib/opencode2api/config.json
      CONFIG_SEED_PATH: /run/config/opencode2api.json
      # Empty defers to the listen addresses in config.json. Export
      # OPENCODE2API_LISTEN / OPENCODE2API_WEBUI_LISTEN to override them.
      LISTEN_ADDRESS: ${OPENCODE2API_LISTEN:-}
      WEBUI_LISTEN_ADDRESS: ${OPENCODE2API_WEBUI_LISTEN:-}
      # Seeds the first config when config.json is absent; ignored afterwards.
      CONFIG_JSON: ${CONFIG_JSON:-}
    # 28080/28081 keep the gateway clear of the 8080/8081 pair that WSL
    # development stacks commonly reserve for a proxy and its own WebUI.
    ports:
      - "${OPENCODE2API_PORT:-28080}:8080"
      - "${OPENCODE2API_WEBUI_PORT:-28081}:8081"
    configs:
      - source: opencode2api_config
        target: /run/config/opencode2api.json
    volumes:
      - opencode2api-state:/var/lib/opencode2api
    tmpfs:
      - /tmp

configs:
  opencode2api_config:
    file: ./config.json

volumes:
  opencode2api-state:
